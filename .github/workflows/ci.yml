name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # zero dependencies, nothing to cache
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 . ./internal/... ./cmd/...
      - name: Fuzz (short)
        run: |
          fuzz() { go test -run='^$' -fuzz="^$1\$" -fuzztime=15s "$2"; }
          for f in FuzzParseConfig FuzzCommandTag FuzzParseRowDescription FuzzParseError; do fuzz $f .; done
          fuzz FuzzMaxPlaceholder ./cmd/pggo
          fuzz FuzzAppendValue ./internal/output
          fuzz FuzzAppendString ./internal/output
      - name: Binary size
        run: make size

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18", "19beta1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # zero dependencies, nothing to cache
      - name: Integration tests on PostgreSQL ${{ matrix.postgres }}
        run: scripts/test-matrix.sh ${{ matrix.postgres }}
