name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./internal/... ./cmd/...
      - name: Fuzz (short)
        run: |
          for f in FuzzMaxPlaceholder FuzzParseURL FuzzAppendValue FuzzParseCommandTag FuzzParseRowDescription FuzzParseError; do
            go test -run='^$' -fuzz="^$f\$" -fuzztime=15s ./internal/postgres
          done
          go test -run='^$' -fuzz='^FuzzAppendString$' -fuzztime=15s ./internal/output
      - name: Binary size
        run: make size

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18", "19beta1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration tests on PostgreSQL ${{ matrix.postgres }}
        run: scripts/test-matrix.sh ${{ matrix.postgres }}
